<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXIS WPC Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* Floating download button */
    .download-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      z-index: 9999;
    }

    .download-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>

<button class="download-btn" id="downloadBtn">⬇</button>

<body>

  <div id="introPage" class="intro-container">
    <div class="intro-card">
      <h1 class="intro-title"><span class="highlight">AXIS</span> WPC Calculator</h1>
      <div class="form-item">
        <label for="userName">Your Name:</label>
        <input type="text" id="userName" placeholder="Enter your name" class="input-field">
      </div>
      <div class="form-item">
        <label for="employeeID">Employee ID:</label>
        <input type="text" id="employeeID" placeholder="Enter your Employee ID" class="input-field">
      </div>
      <div class="form-item">
        <label for="currentTarget">Current Achieved Target:</label>
        <input type="number" id="currentTarget" placeholder="Enter current target" class="input-field">
      </div>
      <div class="form-item">
        <label for="numPolicies">Number of Policies:</label>
        <select id="numPolicies" class="input-field">
          <option value="">Select...</option>
          <script>
            for (let i = 1; i <= 12; i++) {
              document.write(`<option value="${i}">${i}</option>`);
            }
          </script>
        </select>
      </div>
      <button id="startBtn" class="btn-primary">Get Started</button>
    </div>
  </div>

  <div id="calculatorPage" style="display:none;">
    <div class="calculator-container">
      <div class="header-banner">
        <div class="side-img">
          <img src="imgs/calculator.png" alt="Calculator">
        </div>
        <div class="header-title">
          <span class="highlight">AXIS</span> WPC Calculator
        </div>
        <div class="side-img">
          <img src="imgs/logo.png" alt="Logo">
        </div>
      </div>

      <h3 id="welcomeMessage" class="welcome-message"></h3>

      <div id="policiesContainer" class="policies-container"></div>

      <hr class="divider">
      <div class="result-card">
        <h2>Total Accumulative WPC</h2>
        <h2 id="totalWPC">-</h2>
      </div>

      <div class="result-card">
        <div class="table-container">
          <table class="result-table">
            <thead>
              <tr>
                <th>Description</th>
                <th>India</th>
                <th>Manila</th>
                <th>Paris</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>Target</td>
                <td id="indiaTarget">-</td>
                <td id="manilaTarget">-</td>
                <td id="parisTarget">-</td>
              </tr>
              <tr>
                <td>Achieved</td>
                <td id="indiaAchieved">-</td>
                <td id="manilaAchieved">-</td>
                <td id="parisAchieved">-</td>
              </tr>
              <tr>
                <td>Short Fall</td>
                <td id="indiaShortfall">-</td>
                <td id="manilaShortfall">-</td>
                <td id="parisShortfall">-</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
